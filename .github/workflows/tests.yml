name: Artifact checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -e . -r requirements.txt pytest
      - name: Regression tests
        run: python -m pytest -q
      - name: Verify all final certificates
        run: python reproduce.py --mode verify
      - name: Smoke check without PyTorch
        run: python reproduce.py --mode smoke
      - name: Validate all paper rows without searching
        run: python reproduce.py --mode full --parallel 2 --dry-run
